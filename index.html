    <script>
    function moveprogressbar() {
      var elem = document.getElementById("progressbar");
      var width = 1;
      var id = setInterval(frame, 10);
      var totalLoadingTime = 10000;
      function frame() {
        elapsed = Date.now() - timerStart;
        //console.log(elapsed);
        width = elapsed / totalLoadingTime * 100;
        if (width >= 100) {
          clearInterval(id);
        } else {
          elem.style.width = width + '%';
        }
      }
    }
    </script>

    <script type="py">
      import panel as pn
      import numpy as np
      import math

      pn.extension()

      from bokeh.plotting import figure
      from bokeh.layouts import column, row
      from bokeh.models import ColumnDataSource, Select, CheckboxGroup, Slider, RangeSlider, Line, MultiLine, MultiPolygons, LinearColorMapper, ColorBar, Legend, LegendItem, RadioGroup, Button, Div, SingleIntervalTicker, AdaptiveTicker, Circle
      from bokeh.palettes import Spectral

      loadingBg = Div(text="", styles={'background': 'white', 'width': '100%', 'opacity': '1'}, visible = True)

      loadingIcon = pn.indicators.LoadingSpinner(value = True, name='Loading...', visible = False)
      loadingIconBg = Div(text="", styles={'background': 'white', 'width': '100%', 'opacity': '0.9'}, visible = False)
      loading = False

      # Define tour texts
      
      paragraphAttr = """align='justify' style='padding: 0 0 15px'"""
      
      tourStep = 0
      tourTexts = []
      
      tourTexts.append("""<p {0}><b>Care for a little tour?</b></p><p {0}>Use the arrow buttons to navigate through the tour and learn step-by-step how acquisition settings affect data quality and measurement duration of temperature ramp experiments!</p><p {0}>While this demo shows data typical for proteins, most of its conclusions hold true for other molecules as well, e.g., when setting up thermal melt experiments for nucleic acids!</p><p {0}><i>Should you accidentally mess around with some controls, you can reset the current step of the tour at any time using the reset (⟳) button.</i></p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>Can I set up thermal ramp experiments on a Chirascan system the way I'm used to?</b></p><p {0}>Yes you can! There are different ways to do thermal ramp experiments on Chirascan systems:<ul><li>Single wavelength temperature ramps</li><li>Stepped temperature ramps</li><li>Continuous multi-wavelength temperature ramps</li></ul><p {0}>We'll have a quick look at what these are in a little bit, and we'll illustrate this with a most simple example of lysozyme unfolding monitored in the far-UV range. </p><p {0}>We have already chosen some default settings for that and you can already see data as it would be obtained in the plots.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>How long does a temperature ramp experiment take anyway?</b></p><p {0}>It is sensible to think about this question before we have a closer look at the different approaches to temperature ramp experiments.</p><p {0}>Generally, the answer is: it depends. Multiple settings we choose will affect experimental duration, but typically, such an experiment takes about an hour or two.</p><p {0}>The <b>Experimental Trajectory</b> will show you how long the experiment takes depending on current settings.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>So, I can do single wavelength temperature ramps?</b></p><p {0}>Yes—to do so, you just choose acquisition at a single wavelength rather than over a range of wavelengths (which can be done in the advanced monochromator settings in the Chirascan software).</p><p {0}>With this approach, the sample temperature will continuously increase throughout the experiment while the spectroscopic signal at the chosen wavelength is being monitored.</p><p {0}>Let's simulate this now. Typically, you would want to choose a wavelength where the change of the spectral signal is expected to be most pronounced, i.e., at a peak of the spectrum.<span style="color: #67cbdf"> Move both limits of the Wavelength Range slider to 208 nm.</span></p><p {0}>A straight line for the target temperature in the Experimental Trajectory indicates the continuous heating.</p><p {0}>As for our data, we get a single unfolding curve (CD against Temperature), but no strucutral information (CD against Wavelength)! Is the protein really just unfolding? Is the unfolding we see wavelength-independent? Might some other conformation be populated? We cannot tell for sure!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>What determines the duration of a single wavelength temperature ramp experiment?</b></p><p {0}>For temperature ramp experiments with continuous heating, the <b>Heating Rate</b> is the setting that predominantly determines the total experiment time; a heating rate of 1°C/min is typically used, and an experiment with that rate will take about 1 hour and 20 minutes if going from 20°C to 100°C (have a look at the time axis of the Experimental Trajectory).</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>Why would I choose doing a single wavelength temperature ramp?</b></p><p {0}>The advantage of single wavelength temperature ramps over stepped temperature ramps is that, since we only record at a single wavelength, we can afford to increase the time per point for a better signal-to-noise ratio and/or increase the number of data points to get a better temperature resolution, and this can be done within certain limits without increasing the experiment duration.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>How much can I improve the temperature resolution?</b></p><p {0}>Currently, we actually don't make use of a lot of the time we have: the scan phases (i.e., the times during which the system actually records data), shown as red areas in the Experiment Trajectory, are very short—in fact, so short that we cannot even see them in the graph right now!<span style="color: #67cbdf"> Let's change that: Decrease the Temperature Step all the way down to 0.1°C.</span> Now our temperature resolution is pretty much as good as it gets.</p><p {0}>With a heating rate of 1°C/min and a temperature step of 0.1°C, we have a tenth of a minute, i.e., 6 seconds, between acquisitions of any two subsequent data points. So, we might as well increase the time per point, too.<span style="color: #67cbdf"> Increase the Time Per Point to 5 s.</span> Now our signal-to-noise ratio is better, too, and we use the experiment time efficiently!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>And I can do stepped temperature ramps, too?</b></p><p {0}>Of course—when using a Chirascan system, you just tick the 'Enable stepped ramping' checkbox in the temperature ramp settings of the Chirascan software to do so.</p><p {0}>With this approach, acquisitions of full spectra are carried out step-wise, i.e., each spectrum is obtained at a constant temperature, and spectral acquisitions occur at defined temperature steps.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>How do I set up stepped temperature ramps then?</b></p><p {0}>Let's check this out. For a start, we have reset the time per point and temperature step to the previous values and chosen the full wavelength range again.<span style="color: #67cbdf"> Now tick the 'Enable stepped ramping' checkbox.</span></p><p {0}>For stepped temperature ramps, the maximum heating rate is used to heat the sample between scans. Therefore, the total scan time is what predominantly determines the total experiment time here, and this depends on wavelength range, step size, and time-per-point.</p><p {0}>And, of course, the total number of spectra that are being acquired determines the time of the experiment. With the current settings, the experiment would take more than 3 hours!<span style="color: #67cbdf"> Set the temperature step to 5°C, which is a typical value.</span></p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>Why would I choose doing a stepped temperature ramp?</b></p><p {0}>The advantage of stepped temperature ramps over single wavelength temperature ramps is that we get to see what is actually happening to the structure of the molecule and we may identify wavelength-dependent changes.</p><p {0}>However, our temperature resolution is much lower now, so the determination of thermodynamic parameters will be less precise.</p><p {0}>This may become a problem particularly when sharp or overlapping transitions are present.<span style="color: #67cbdf"> Switch from our single transition example to the example with multiple transitions now.</span> Look at the plot for CD against temperature: the transitions here are covered by only one or two data points per wavelength!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>But I want structural information AND a good temperature resolution without waiting for hours for the experiment to finish!</b></p><p {0}>Well, you're in luck, because Chirascan systems allow just that, an approach we call <b>continuous, multi-wavelength temperature ramps</b>.</p><p {0}>With this approach, the sample is continuously heated as in single wavelength temperature ramps, but at the same time we record full spectra as in stepped temperature ramps.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>But that means the temperature will change during a scan!</b></p><p {0}>Precisely. That's why it's important to use proper software for analysis of such experiments that takes this into account. Such software is available from Applied Photophysics.</p><p {0}>Usually, settings are chosen such that the temperature difference between the beginning and end of each scan is no larger than 1°C, so this effect will be hardly noticeable when visually inspecting the data.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>How do I set up a continuous, multi-wavelength temperature ramp then?</b></p><p {0}>That's easy: you just <span style="color: #67cbdf">untick 'Enable stepped ramping'</span> and scan over a range of wavelengths just like for stepped temperature ramps.</p><p {0}>With the current settings, there'd be a lot of idle time, so we can actually afford a smaller temperature step.<span style="color: #67cbdf"> Set the Temperature Step to 1°C!</span> Now we get a series of spectra at a decent temperature resolution without taking any longer than with classical temperature ramp approaches!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>Can I speed up the experiment even further by choosing a faster heating rate?</b></p><p {0}>Well, the heating rate should not be too large because there is always a temperature lag between the target temperature and the actual sample temperature.</p><p {0}>Basically, heat transfer between the holder and the sample is limited. This depends on the sample cell (and, if applicable, adaptor) dimensions (e.g., wall thickness) and material, the sample itself, and the temperature gradient between the two.</p><p {0}>Due to this limitation, usually two effects can be observed:<ul><li>The sample temperature will not always catch up immediately with the temperature of the holder, i.e., the target temperature.</li><li>The sample temperature remains somewhat below the target temperature even if the system has equlibrated.</li></ul>Look at the Experimental Trajectory: both of these effects are evident from a comparison between target and sample temperature.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>But this means that temperature readings for the holder won't accurately reflect the sample temperature!</b></p><p {0}>This is correct. The temperature lag becomes more pronounced at faster heating rates, but even at slow heating rates there will always be a certain temperature lag.</p>Therefore, it is imperative to use <b>in-sample temperature probes</b> in such experiments that are immersed directly in the sample and record the actual sample temperature.<p {0}></p>""".format(paragraphAttr))

      tourTexts.append("""<p {0}><b>Does this mean that spectra are not recorded at constant temperature in stepped temperature ramps?</b></p><p {0}><p {0}>We do use a high heating rate to increase temperature between scans in stepped temperature ramps, so this is a valid concern. For this reason, we can adjust a <b>Settling Time</b> setting.</p><p {0}>Let's look at a stepped temperature ramp once more. The settling time, shown as blue areas in the Experiment Trajectory, is an additional delay between the moment the target temperature is reached and beginning of the next acquisition.</p><p {0}>By using this setting, we can ensure that the sample temperature has stabilised before we measure.<span style="color: #67cbdf"> Try reducing the settling time from its default value of 30 s</span> and look at the sample temperature during the scan phase—is the sample temperature constant throughout each scan?</p><p {0}>With a suitable settling time, the sample temperature is constant during scans of a stepped temperature ramp, but the sample temperature will still be somewhat lower than the target temperature, so an in-sample temperature probe remains essential!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>If there is always a lag, how can I ever achieve my intended stop temperature?!</b></p><p {0}><p {0}>Let's look again at a continuous, multi-wavelength temperature ramp for lysozyme.</p><p {0}>The fact that there is always a discrepancy between target and sample temperature, even after equilibration, indeed implies that the set stop temperature won't ever be reached.</p><p {0}>To counteract this effect, just choose a stop temperature that is a few degrees celsius above your intended final temperature. For example, if you want the sample to reach 100°C at the end of the experiment,<span style="color: #67cbdf"> choose a stop temperature of 104°C</span>.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>This temperature range is quite broad—can I narrow it down for a quicker experiment?</b></p><p {0}>If we know where to expect the unfolding transition(s), we might choose a somewhat narrower temperature range. For example, we know that the melting temperature of lysozyme is near 70°C, so we might<span style="color: #67cbdf"> choose a range of, let's say, 50°C to 90°C</span>.</p><p {0}>However, if the melting temperature of an unfolding transition is unknown or the transition is shallow, then it is advised to choose a broader temperature range.</p><p {0}>If the time of the experiment is of less concern, it is recommended to rather choose a broad temperature range, because it is desirable to sufficiently cover the ranges before and after an unfolding transition to obtain enough baseline data. Otherwise, the analysis software might struggle with determining the pre- and post-transition baselines.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>Also, I'm not happy with the short integration time right now.</b></p><p {0}>Sure, we usually measure with longer integration times, so<span style="color: #67cbdf"> let's set the Time Per Point to 1 s</span>.</p><p {0}>What has happened here? We have doubled the integration time, so now each scan takes about twice as long. At a heating rate of 1°C/min and a temperature step of 1°C, we have 1 min to get a scan done. But now a scan takes much longer than a minute!</p><p {0}>A scan is not being interrupted, so, instead, all the scans happen in succession and are only finished long after we have reached our final target temperature! This means that a number of spectra is obtained at the final temperature, which isn't of any benefit!</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>What can we do about this then?</b></p><p {0}>Our goal is for a scan to take about as long as the temperature step divided by the heating rate.</p><p {0}>If the scan takes much longer, we obtain multiple spectra at the same temperature towards the end of the experiment, and if a scan takes much shorter, we end up with too much idle time that's not being used for recording data.</p><p {0}>To reduce the time spent on each scan, we might narrow our wavelength range; look at the CD against Wavelength:<span style="color: #67cbdf"> there is hardly anything happening beyond 250 nm, so let's cut off the wavelength range there</span>.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>What about the lower end of the wavelength range?</b></p><p {0}>We might also choose a higher wavelength for the lower limit, because the data quality at low wavelengths is often worse anyway.</p><p {0}>Look at the CD against Wavelength: the data becomes quite noisy at low wavelengths towards high temperatures.</p><p {0}>This is because of the absorbance:<span style="color: #67cbdf"> switch to the absorbance data to have a look</span>.</p><p {0}>The reason is that usually the absorbance is quite high at low wavelengths already, and on top of that, the absorbance typically increases a bit upon heating.</p><p {0}>We started with a maximum absorbance already somewhat above 2 AU, and the absorbance increases to almost 3 AU, so the signal-to-noise ratio becomes even worse.</p><p {0}><span style="color: #67cbdf"> So, let's set the lower wavelength limit to 190 nm</span>.</p><p {0}>At 190 nm, the absorbance will be well below 2 AU at the end of the temperature ramp.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>What else can be done?</b></p><p {0}>The time per scan is still a bit too high. One more option to shorten it is increasing the step size: we gain some time at the cost of spectral resolution.<span style="color: #67cbdf"> Set the Step Size to 1.5 nm</span>.</p><p {0}>Now the time per scan is just under a minute, and we don't get a number of scans at the same temperature anymore.</p>""".format(paragraphAttr))
      
      tourTexts.append("""<p {0}><b>I have more questions!</b></p><p {0}>This concludes our little demo⁠—hopefully it was fun and you learned something.</p><p {0}>Now you can have a go and further explore how changing parameters affects temperature ramp experiments.</p><p {0}>To get answers to further questions, why not check out our <a href="https://www.photophysics.com/faqs/methods-techniques/">FAQ section</a>?</p>""".format(paragraphAttr))

      R = 8.314

      # Function for setting up normalized sample temperature profile that takes into account lag
      
      def update_sampleTempParams():
          global heatingRate
          global height1_m, height1_b, min1_m, min1_b, offset1_m, offset1_b
          global steepness1_1, steepness1_0
          global height2_m, height2_b, min2_m, min2_b, offset2_1, offset2_0
          global steepness2_0, steepness2_1, steepness2_2, steepness2_3, steepness2_4
          global height1, min1, offset1, steepness1
          global height2, min2, offset2, steepness2
          global slope, intercept
          
          height1 = height1_m * heatingRate + height1_b
          min1 = min1_m * heatingRate + min1_b
          offset1 = offset1_m * heatingRate + offset1_b
          steepness1 = steepness1_1 * heatingRate ** steepness1_0
          
          height2 = height2_m * heatingRate + height2_b
          min2 = min2_m * heatingRate + min2_b
          offset2 = offset2_1 * heatingRate ** offset2_0
          steepness2 = steepness2_4 * heatingRate ** 4 + steepness2_3 * heatingRate ** 3 + steepness2_2 * heatingRate ** 2 + steepness2_1 * heatingRate + steepness2_0
          
          y1 = height1 / 2 + min1
          y2 = height2 / 2 + min2
          
          slope = (y2 - y1) / (offset2 - offset1)
          intercept = y2 - slope * offset2
          
      # Function for creating sample temperature values that take into account lag
      
      # xVals:    Array with x-values (in minutes, starting at zero) for which temperature values are to be calculated
      # start:    Local start temperature at which heating begins
      # stop:     Local stop temperature at which heating ends
          
      def createSampleTempVals(xVals, start, stop, startTime = None, zeroStart = True): 
          global height1, min1, offset1, steepness1
          global height2, min2, offset2, steepness2
          global slope, intercept
          
          maxStop = 0.955666 * stop + 1.045151
          tempDiff = maxStop - start
          tempFactor = maxStop / start
          if startTime == None:
              xStart = xVals[0]
          else:
              xStart = startTime
          
          yVals = []
          for i, currX in enumerate(xVals):
              #x = (currX - xStart) / tempDiff
              x = (currX - xStart) / tempDiff * 1.5
              if x <= offset1:
                  yVal = height1 / (1 + math.exp(-steepness1 * (x - offset1))) + min1
              elif x >= offset2:
                  yVal = height2 / (1 + math.exp(-steepness2 * (x - offset2))) + min2
              else:
                  yVal = slope * x + intercept
              yVal = yVal * tempDiff
              if zeroStart == True:
                  if i == 0:
                      zeroVal = yVal
                  yVal = yVal - zeroVal
              yVals.append(yVal)
              
          return yVals
        
      # Function to get nice axis scale
      
      def getAxisScale(min, max):
          if min == max:
              result = [-0.005, 0.005, 2]
          else:
              roundedMax = math.ceil(max/10 ** (math.floor(math.log10(abs(max)))))*10 ** (math.floor(math.log10(abs(max)))) if max != 0 else 0
              roundedMin = abs(math.floor(min/10 ** (math.floor(math.log10(abs(min))))) * 10 ** (math.floor(math.log10(abs(min)))))*math.copysign(1, min) if min != 0 else 0
              roundedRange = roundedMax - roundedMin
              roundedRange = math.ceil(roundedRange/10 ** (math.floor(math.log10(abs(roundedRange))))) * 10 ** (math.floor(math.log10(abs(roundedRange)))) if roundedRange != 0 else 0
              ticks = [5, 4, 3, 4, 5, 3, 7, 4, 3]
              ticksIDX = int(abs(roundedRange/10 ** (math.floor(math.log10(abs(roundedRange))))) - 1) if roundedRange != 0 else 0
              ticks = [5, 4, 3, 4, 5, 3, 7, 4, 3]
              interval = roundedRange / ticks[ticksIDX]
              roundedMax2 = math.ceil(roundedMax/interval)*interval
              roundedMin2 = math.floor(roundedMin/interval)*interval
              roundedRange2 = roundedMax2 - roundedMin2
              intervals = int(roundedRange2 / interval)
              result = [roundedMin2, roundedMax2, intervals]
          return result

      def update_WLs():
          global lowWL, highWL, stepSize, WLs
          x = np.arange(highWL, lowWL - stepSize, -stepSize).tolist()
          if x[-1] < lowWL: x = x[:-1]
          x = [round(val, 2) for val in x]
          WLs = x
        
      # Function for simulating temperature-dependent change of absorbance
      
      # Resulting values consist of a linear growth phase followed by a polynomial growth phase
      
      # T:           Temperature value
      # slope:       Slope of linear growth, mdeg/°C
      # intercept:   Intercept of linear growth, mdeg
      # refPointX:   x-coordinate of reference point through which the polynomial growth curve will pass
      # refPointY:   y-coordinate of reference point through which the polynomial growth curve will pass
      # phaseSwitch: x-coordinate at which growth switches from linear to polynomial
      # flatness:    Level of flatness of polynomial growth phase; a flatness of 1 will result in a second linear phase

      def getAbsAddAtT(T, slope, intercept, refPointX, refPointY, phaseSwitch, flatness):
          if T < phaseSwitch:
              yGrowth = 0
          else:
              refPointXOffset = refPointX - phaseSwitch
              number = math.log((refPointY - slope * refPointXOffset) / (flatness / refPointXOffset * refPointY * 10), refPointXOffset / 10)
              yGrowth = 10 ** (2 - number) * (T - phaseSwitch) ** number * flatness / refPointXOffset * refPointY / 10
          yLinear = slope * T + intercept
          yVal = yLinear + yGrowth
          return yVal

      # Function for creating y values based on specified Gaussians

      def createYVals(peaks, fullrange = False):
          global lowWL, highWL, stepSize, WLs, WLmin, WLmax
          
          if fullrange == False:
              low = lowWL
              high = highWL
              xrange = WLs
          else:
              low = WLmin
              high = WLmax
              xrange = np.arange(WLmax, WLmin - stepSize, -stepSize).tolist()
              if xrange[-1] < lowWL: x = xrange[:-1]
              xrange = [round(val, 2) for val in xrange]
          
          y = np.zeros((int((high - low) / stepSize * 1.0) + 1), dtype=int)
          for item in peaks:
              SD = peaks[item]['FWHM'] / (2 * math.sqrt(2 * math.log(2)))
              curr = [math.exp(-((x - peaks[item]['WL']) / SD)**2 / 2) * peaks[item]['I'] for x in xrange]
              y = y + curr
          return y
          
      def createPalette(length, stopColors, argStopPositions = []):
          if len(argStopPositions) == 0:
              stopPositions = [float(i / (len(stopColors) - 1)) for i in range(0, len(stopColors))]
          else:
              stopPositions = argStopPositions
          if length == 1:
              colors = [stopColors[0]]
          else:
              colors = []
              for i in range(length):
                  pos = 1 / (length - 1) * i
                  if pos == 0:
                      newRGB = stopColors[0]
                  elif pos == 1:
                      newRGB = stopColors[-1]
                  else:
                      startStopPos = max(stopPos for stopPos in stopPositions if stopPos <= pos)
                      endStopPos = min(stopPos for stopPos in stopPositions if stopPos > pos)
                      segmentPos = (pos - startStopPos) / (endStopPos - startStopPos)
                      startStopColor = stopColors[stopPositions.index(startStopPos)]
                      endStopColor = stopColors[stopPositions.index(endStopPos)]
                      startRGB = tuple(int(startStopColor.lstrip('#')[i:i+2], 16) for i in (0, 2, 4))
                      endRGB = tuple(int(endStopColor.lstrip('#')[i:i+2], 16) for i in (0, 2, 4))
                      newR = hex(int(startRGB[0] + (endRGB[0] - startRGB[0]) * segmentPos)).lstrip("0x").zfill(2).upper()
                      newG = hex(int(startRGB[1] + (endRGB[1] - startRGB[1]) * segmentPos)).lstrip("0x").zfill(2).upper()
                      newB = hex(int(startRGB[2] + (endRGB[2] - startRGB[2]) * segmentPos)).lstrip("0x").zfill(2).upper()
                      newRGB = '#' + newR + newG + newB
                  colors.append(newRGB)
          return colors

      def update_settlingBoxes():

          global settlingColor, settlingBoxesSource, settlingBoxesGlyphRenderer
          
          settlingXList = []

              x1 = (settlingTime + scanTime + stepTemp / heatingRate - tolerance / heatingRate) * i

              settlingXList.append([x1, x2, x2, x1])

      def update_scanTimePoints():
          global lowWL, highWL, stepSize, WLs, timePerPoint, scanTimePoints
          
          if lowWL < highWL:
              shutterTime = 2 # in seconds
          else:
              shutterTime = 0
          
          # Parameters for calculating time in ms
          a = -132.22 * (math.log10(stepSize) ** 2) + 140.27 * math.log10(stepSize) + 182.29
          b = -0.00004 * stepSize ** 2 - 0.0004 * stepSize + 0.9755
          c = -0.8709 * stepSize ** 2 + 39.929 * stepSize + 47.622
          
          times = [shutterTime / 60.0]
          currentTime = shutterTime / 60.0
          for i, WL in enumerate(WLs):
              monoMoveTime = ((a * b ** (WL - stepSize / 2 - 180) + c) / 1000.0) / 60.0
              currentTime += monoMoveTime + timePerPoint / 60.0
              times.append(currentTime)
          times = times[:-1]
          scanTimePoints = times # in minutes
          
      def update_scanTime():
          global lowWL, highWL, scanTimePoints, scanTime
          
          flyBackBase = 2 # in seconds
          flyBackRate = 0.00648359715584863 # in s / nm
          flyBackTime = ((highWL - lowWL) * flyBackRate + flyBackBase) / 60.0 # in minutes
          
          scanTime = scanTimePoints[-1] + timePerPoint / 60.0
          if lowWL < highWL: scanTime += flyBackTime
          if scanTime * 60.0 >= 1:
              scanTimeText = "{:.0f}".format(round(scanTime * 60.0, 0)).rstrip("0")
          else:
              scanTimeText = "{:.1f}".format(round(scanTime * 60.0, 1)).rstrip("0")
          txScantime.text = "Time per scan: " + scanTimeText + " s"
      
      def getScanStarts():
          global steppedBool, tempStepsNumber, scanTime, continuousIdleTime, settlingTime, stepTemp, heatingRate, tolerance
          
          scanStartsList = []
          if steppedBool == True:
              for i in range(tempStepsNumber):
                  start = settlingTime + (scanTime + settlingTime + stepTemp / heatingRate - tolerance / heatingRate) * i
                  scanStartsList.append(start)
          else:
              scanStartsList.append(0)
              for i in range(tempStepsNumber - 1):
                  start = scanTime + stepTemp / heatingRate + (continuousIdleTime + scanTime) * i
                  if scanTime >= tolerance / heatingRate:
                      start -= tolerance / heatingRate
                  scanStartsList.append(start)
          return scanStartsList

      def update_designPlot():
          global steppedBool
          global startTemp, stopTemp, heatingRate, tempStepsNumber, scanTime, continuousIdleTime
          global ContinuousHeatStartGlyphRenderer, ContinuousHeatGlyphRenderer, ContinuousHeatEndGlyphRenderer, ContinuousHeatLagGlyphRenderer
          global SteppedHeatGlyphRenderer, SteppedConstantGlyphRenderer, SteppedHeatLagGlyphRenderer
          global steppedSampleTempX, steppedSampleTempY
          
          endTime = getEndTime()

          else:

          Designplot.x_range.end = totalTime
          Designplot.y_range.end = maxTemp
                   
          update_scanBoxes()
          update_settlingBoxes()
          
          # Create lists of points for segments during continuous temperature ramp
          
          if steppedBool != True:
              ContinuousHeatLagX = np.linspace(scanTime, endTime, int((endTime - scanTime) / timeResolution)).tolist()
                      
              ContinuousHeatLagY = createSampleTempVals(ContinuousHeatLagX, startTemp, stopTemp)
              ContinuousHeatLagY = [startTemp + val for val in ContinuousHeatLagY]
                      
              ContinuousHeatLagX = [ContinuousHeatLagX[i] for i, val in enumerate(ContinuousHeatLagY)]
              
              ContinuousHeatStartSource.data = dict(x=[0, scanTime], y=[startTemp, startTemp])
              ContinuousHeatSource.data = dict(x=[scanTime, scanTime + (stopTemp - startTemp) / heatingRate], y=[startTemp, stopTemp])
              ContinuousHeatEndSource.data = dict(x=[scanTime + (stopTemp - startTemp) / heatingRate, endTime], y=[stopTemp, stopTemp])
              ContinuousHeatLagSource.data = dict(x=ContinuousHeatLagX, y=ContinuousHeatLagY)

          # Create list of points for segments representing constant target temperature phase during stepped temperature ramp
          
          if steppedBool == True:
              SteppedConstantList = []
              for i in range(tempStepsNumber):
                  p1x = (settlingTime + stepTemp / heatingRate + scanTime - tolerance / heatingRate) * i + tolerance / heatingRate
                  if i == 0:
                      p1x -= tolerance / heatingRate
                      p1y = startTemp
                  elif stepTemp < stepTemp:
                      p1y = startTemp + stepTemp * (i - 1) + stepTemp
                  else:
                      p1y = startTemp + stepTemp * i
                  p1 = (p1x, p1y)
                  
                  p2x = p1x + settlingTime + scanTime - tolerance / heatingRate
                  if i == 0:
                      p2x += tolerance / heatingRate
                      p2y = startTemp
                  elif stepTemp + settlingTime * heatingRate < stepTemp:
                      p2y = startTemp + stepTemp * (i - 1) + stepTemp + settlingTime * heatingRate
                  else:
                      p2y = startTemp + stepTemp * i
                  p2 = (p2x, p2y)
                  
                  SteppedConstantList.append([p1, p2])
              
              SteppedConstantX = [[segment[0][0], segment[1][0]] for segment in SteppedConstantList]
              SteppedConstantY = [[segment[0][1], segment[1][1]] for segment in SteppedConstantList]
              
              SteppedConstantSource.data = dict(
                  xs=SteppedConstantX,
                  ys=SteppedConstantY
              )

              # Create list of points for segments representing target heating phases during stepped temperature ramp
              
              SteppedHeatList = []
              for i in range(tempStepsNumber - 1):
                  p1x = settlingTime + scanTime + (stepTemp / heatingRate + settlingTime + scanTime - tolerance / heatingRate) * i
                  p2x = p1x + stepTemp / heatingRate
                  p1y = startTemp + stepTemp * i
                  p2y = p1y + stepTemp
                  p1 = (p1x, p1y)
                  p2 = (p2x, p2y)
              
                  SteppedHeatList.append([p1, p2])
              
              SteppedHeatX = [[segment[0][0], segment[1][0]] for segment in SteppedHeatList]
              SteppedHeatY = [[segment[0][1], segment[1][1]] for segment in SteppedHeatList]
              
              SteppedHeatSource.data = dict(
                  xs=SteppedHeatX,
                  ys=SteppedHeatY
              )
              
              # Get list of points representing sample temperature with lag during stepped temperature ramp
              
              SteppedHeatLagY = [item for innerlist in steppedSampleTempY for item in innerlist]
              SteppedHeatLagX = [item for innerlist in steppedSampleTempX for item in innerlist]
              
              SteppedHeatLagSource.data = dict(
                  x=SteppedHeatLagX,
                  y=SteppedHeatLagY
              )
          
          update_designPlotVisibilities()

          scanXstarts = getScanStarts()

          TempVsWL.append([startTemp] * WLnumber)

          if steppedBool == True:
              TempVsWL.extend([val for i, val in enumerate(steppedSampleTempY) if i % 2 != 0]) # Only use every second element in steppedSampleTempY, i.e., only temperatures for scans, excluding temperatures between scans
          else:
              for i in range(1, tempStepsNumber):
                  firstTime = scanXstarts[i]
                  currentTimes = [timepoint + firstTime for timepoint in scanTimePoints]
                  currentTemps = createSampleTempVals(currentTimes, startTemp, stopTemp, scanTime, False)
                  currentTemps = [startTemp + val for val in currentTemps]
                  currentTemps = [val if val < stopTemp else stopTemp for val in currentTemps]
                  TempVsWL.append(currentTemps)

          scanNumber = len(TempVsWL)
          stopColors = ['#5e4fa2', '#3288bd', '#66c2a5', '#abdda4', '#e6f598', '#ffffbf', '#fee08b', '#fdae61', '#f46d43', '#d53e4f', '#9e0142']
          SignalvsWLpalette = createPalette(scanNumber, stopColors)
          SignalvsTpalette = createPalette(WLnumber, stopColors)
          SignalvsTpalette.reverse()
          
          # Generate Abs vs WL values
          
          ABSpeaks = ExamplesAbsparams["example" + str(selectedExample)]["peaks"]

          intercept = ExamplesAbsparams["example" + str(selectedExample)]["intercept"]
          refPointX = ExamplesAbsparams["example" + str(selectedExample)]["refPointX"]
          refPointY = ExamplesAbsparams["example" + str(selectedExample)]["refPointY"]
          phaseSwitch = ExamplesAbsparams["example" + str(selectedExample)]["phaseSwitch"]
          flatness = ExamplesAbsparams["example" + str(selectedExample)]["flatness"]
          FABSvsWLy = createYVals(ABSpeaks)
          ABSvsWL = []
          
          if "factorpeaks" in ExamplesAbsparams["example" + str(selectedExample)]:
              factorpeaks = ExamplesAbsparams["example" + str(selectedExample)]["factorpeaks"]
              factors = createYVals(factorpeaks)
              
          if "offsetpeaks" in ExamplesAbsparams["example" + str(selectedExample)]:
              offsetpeaks = ExamplesAbsparams["example" + str(selectedExample)]["offsetpeaks"]
              offsets = createYVals(offsetpeaks)
          else:
              offset = ExamplesAbsparams["example" + str(selectedExample)]["offset"]
          
          for iScan, scan in enumerate(TempVsWL):
              currentScan = []
              for iWL, TempC in enumerate(scan):
                  if "factorpeaks" in ExamplesAbsparams["example" + str(selectedExample)]:
                      factor = factors[iWL]
                  else:
                      factor = FABSvsWLy[iWL] / maxAbs
                  if "offsetpeaks" in ExamplesAbsparams["example" + str(selectedExample)]:
                      offset = offsets[iWL]
                  ABSval = getAbsAddAtT(TempC, slope, intercept, refPointX, refPointY, phaseSwitch, flatness)
                  ABSval = ABSval * factor + offset
                  currentScan.append(ABSval)
              ABSvsWL.append(currentScan)
          
          if absBool == False:
              
              CDvsWL = []
              
              CDparams = ExamplesCDparams["example" + str(selectedExample)]
              TmsC = ExamplesThermoParams["example" + str(selectedExample)]["TmsC"]
              TmsK = [TempC + 273.15 for TempC in TmsC]
              dHs = ExamplesThermoParams["example" + str(selectedExample)]["dHs"]
              speciesNumber = len(CDparams)
              
              # Create y-values for CD spectra of all species
              CDvsWLy = []
              for species in range(speciesNumber):
                  currentSpec = createYVals(CDparams["species" + str(species)])
                  CDvsWLy.append(currentSpec)
              
              for iScan, scan in enumerate(TempVsWL):
                  currentScan = []
                  for iWL, TempC in enumerate(scan):
                      Ks = []
                      fracs = []
                      thetas = []
                      TempK = TempC + 273.15
                      
                      # Get the signal for each pure species at the current wavelength
                      for species in range(speciesNumber):
                          thetas.append(CDvsWLy[species][iWL])
                          
                      # Calculate the equilibrium constants for all transitions for the given temperature
                      for trans in range(speciesNumber - 1):
                          K = getK(TempK, TmsK[trans], dHs[trans])
                          Ks.append(K)

                      # Determine demoninator, which is always the same one when calculating the fraction of a species
                      denominator = 0
                      for K in range(len(Ks) + 1):
                          denominator += np.prod(Ks[:K])
                          
                      # Calculate the fractions of all species for the given equilibrium constants
                      for species in range(speciesNumber):
                          fracs.append(np.prod(Ks[:species]) / denominator)
                      
                      CDval = 0
                      for species in range(speciesNumber):
                          CDval += fracs[species] * thetas[species]
                      
                      CDval += currentMs[iWL] * TempC + currentBs[iWL]
                          
                      currentScan.append(CDval)
                  CDvsWL.append(currentScan)

              # Update CD vs WL plot
              
              CDvsWLxs = [WLs for scan in CDvsWL]
              CDvsWLys = CDvsWL
              
              # Add noise to CD data
              
              NoisevsWL = []

              for iScan, scan in enumerate(ABSvsWL):
                  #Noise = [np.random.normal(0, correctionFactor * SD / math.sqrt(timePerPoint * 10 ** (-a)) / abs(cd)) for a, cd in zip(scan, CDvsWL[iScan])]
                  Noise = [np.random.normal(0, correctionFactor * SD / math.sqrt(timePerPoint * 10 ** (-a))) for a in scan]
                  NoisevsWL.append(Noise)
              
              CDvsWLnoise = []
              for iScan, scan in enumerate(CDvsWLys):
                  currentScan = [val + n for val, n in zip(scan, NoisevsWL[iScan])]
                  CDvsWLnoise.append(currentScan)
              CDvsWLys = CDvsWLnoise

                  ys=CDvsWLys,
                  colors=SignalvsWLpalette

                  SignalvsTcolorbar.title = "Wavelength (nm)"
                  CDvsWLsingleglyphRenderer.visible = False
                  SignalvsWLplot.x_range.start = lowWL
                  SignalvsWLplot.x_range.end = highWL
              
              # Get CD vs T values
              
              TempVsScan = np.array(TempVsWL).T.tolist()
              CDvsScan = np.array(CDvsWLys).T.tolist()
              
              # Update CD vs T plot
              
              CDvsTxs = [WL for WL in TempVsScan]
              CDvsTys = [WL for WL in CDvsScan]
              
              SignalvsTSource.data = dict(
                  xs=CDvsTxs,
                  ys=CDvsTys,
                  colors=SignalvsTpalette
              )
              
              CDmin = min([min(scan) for scan in CDvsWL])
              CDmax = max([max(scan) for scan in CDvsWL])
              
              Signalmin = CDmin
              Signalmax = CDmax
              
          else:
                  
              # Update Abs vs WL plot
              
              ABSvsWLxs = [WLs for scan in ABSvsWL]
              ABSvsWLys = ABSvsWL
              
              SignalvsWLSource.data = dict(
                  xs=ABSvsWLxs,
                  ys=ABSvsWLys,

              )
              
              # Get Abs vs T values
              
              TempVsScan = np.array(TempVsWL).T.tolist()

              # Update Abs vs T plot
              
              ABSvsTxs = [WL for WL in TempVsScan]

      def update_tempStepsNumber():
          global startTemp, stopTemp, stepTemp, tempStepsNumber
          tempStepsNumber = math.ceil((stopTemp - startTemp) / stepTemp + 1)
          
      def update_continuousIdleTime():
          global startTemp, stopTemp, stepTemp, heatingRate, tempStepsNumber, scanTime, continuousIdleTime
          
          if stepTemp / heatingRate - scanTime < 0:
              continuousIdleTime = 0
          else:
              continuousIdleTime = ((stopTemp - startTemp) / heatingRate - stepTemp / heatingRate) / (tempStepsNumber - 2) - scanTime
          
      def getEndTime():
          global startTemp, stopTemp, tempStepsNumber, heatingRate, tolerance, scanTime, continuousIdleTime
          
          if continuousIdleTime == 0:
              endTime = scanTime * (1 + tempStepsNumber) - tolerance / heatingRate
          else:
              endTime = (stopTemp - startTemp) / heatingRate + 2 * scanTime - tolerance / heatingRate
          return endTime
          
      def getTotalTime(endTime):
          global steppedBool, settlingTime, startTemp, stopTemp, stepTemp, tempStepsNumber, heatingRate, tolerance, scanTime
          if steppedBool == True:
              totalTime = (settlingTime + scanTime + stepTemp / heatingRate - tolerance / heatingRate) * (tempStepsNumber - 1) + settlingTime + scanTime
          else:
              if scanTime + (stopTemp - startTemp) / heatingRate > endTime:
                  totalTime = scanTime + (stopTemp - startTemp) / heatingRate
              else:
                  totalTime = endTime
          return totalTime

      # Function for creating list of points (two lists with x and y values) representing sample temperature with lag during stepped temperature ramp
      
      def update_steppedSampleTempVals():
          global settlingTime, scanTime, startTemp, stepTemp, heatingRate, tolerance, timeResolution, scanTimePoints
          global steppedSampleTempX, steppedSampleTempY, steppedBool, tempStepsNumber
        
          if steppedBool == True:
              SteppedHeatLagX = []
              for i in range(tempStepsNumber - 1):
                  noScanxStart = settlingTime + scanTime + (stepTemp / heatingRate + settlingTime + scanTime - tolerance / heatingRate) * i
                  noScanX = np.linspace(noScanxStart, noScanxStart + stepTemp / heatingRate + settlingTime, int((stepTemp / heatingRate + settlingTime) / timeResolution)).tolist()
                  scanxStart = noScanxStart + stepTemp / heatingRate + settlingTime
                  scanX = [scanxStart + t for t in scanTimePoints]
                  SteppedHeatLagX.append(noScanX)
                  SteppedHeatLagX.append(scanX)
              
              SteppedHeatLagY = [[0 for item in innerlist] for innerlist in SteppedHeatLagX]
              pointsNumberNoScan = len(SteppedHeatLagX[0])
              pointsNumberScan = len(SteppedHeatLagX[1])
              
              yStart = startTemp
              for i in range(tempStepsNumber - 1):
                  yEnd = startTemp + (i + 1) * stepTemp
                  SteppedHeatLagXstep = [item for innerlist in SteppedHeatLagX[i*2:] for item in innerlist]
                  SteppedHeatLagYstep = createSampleTempVals(SteppedHeatLagXstep, yStart, yEnd)
                  for j in range(len(SteppedHeatLagY) - i * 2):
                     for k in range(len(SteppedHeatLagY[j + i * 2])):
                         SteppedHeatLagY[j + i * 2][k] += SteppedHeatLagYstep[pointsNumberNoScan * int((j + 1) / 2) + pointsNumberScan * int(j / 2) + k]
                      
                  yStart = yStart + SteppedHeatLagYstep[-1]
              
              SteppedHeatLagY = [[startTemp + item for item in innerlist] for innerlist in SteppedHeatLagY]
              
              steppedSampleTempX = SteppedHeatLagX
              steppedSampleTempY = SteppedHeatLagY
